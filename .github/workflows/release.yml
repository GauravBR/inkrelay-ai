# Publishes @inkrelay/mcp (the mcp/ folder) through npm trusted publishing (OIDC, no stored token) with staged publishing:
# the workflow only stages the version; a maintainer approves it with 2FA (npm stage approve).
# No npm provenance: npm does not generate it for a private repository.
#
# The OIDC token is granted only to the publish job, which checks out nothing and installs no
# dependencies, so no dependency code can run where a token can be minted. The build job runs
# dependency code but has no id-token permission. No caching in release jobs.
name: release
on: { push: { tags: ["v*"] } }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: mcp/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Tag commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on origin/main"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) { console.error('tag does not match version'); process.exit(1) }"
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: mkdir pack && npm pack --pack-destination pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: mcp/pack/*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # Staged publishing needs npm 11.15.0 or later; 12.2.0 needs Node 22.22.2+, 24.15+ or 26+.
      - run: npm install -g npm@12.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: package-tarball, path: pack }
      - name: Stage publish
        run: |
          set -eu
          [ "$(find pack -type f | wc -l)" -eq 1 ] && [ "$(find pack -type f -name '*.tgz' | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .tgz in pack/"; exit 1; }
          tarball="./$(find pack -type f -name '*.tgz')"
          # A prerelease version such as 0.2.0-rc.1 goes to the next dist-tag, not latest.
          # OIDC supplies the credential; NODE_AUTH_TOKEN must stay unset.
          case "$GITHUB_REF_NAME" in
            *-*) npm stage publish "$tarball" --access public --tag next ;;
            *) npm stage publish "$tarball" --access public ;;
          esac
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: GitHub release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --generate-notes ;;
          esac
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
